<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Reminder</title>
<style>
  :root { --bg: #fff; --text: #111; --hint: #8a8f98; --card: #f1f3f6; --accent: #2481cc; --accent-text: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17212b; --text: #f5f5f5; --hint: #708499; --card: #232e3c; --accent: #5288c1; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; gap: 10px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
         height: 100dvh; overflow: hidden; font: 15px/1.3 system-ui, -apple-system, "Vazirmatn", sans-serif;
         background: var(--bg); color: var(--text); user-select: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .card { background: var(--card); border-radius: 14px; }
  #text { width: 100%; font: inherit; color: inherit; padding: 12px; border: 0; outline: 0; resize: none; height: 48px; background: transparent;
          user-select: text; }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; padding: 9px 2px; border-radius: 10px; background: var(--card); font-size: 13px; white-space: nowrap; }
  .on { background: var(--accent) !important; color: var(--accent-text) !important; }
  #cal { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px; }
  #calHead { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px; font-weight: 600; }
  #calHead button { background: none; font-size: 22px; width: 36px; height: 30px; color: var(--accent); }
  #grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 2px; min-height: 0; }
  #grid div { display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--hint); }
  #grid button { background: none; border-radius: 10px; font-size: 15px; }
  #grid button:disabled { color: var(--hint); opacity: .45; }
  #grid button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  #grid button.fri { color: #e5534b; }
  #time { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; direction: ltr; }
  #time button { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); font-size: 20px; color: var(--accent); }
  #time span { font-size: 28px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
  #save { padding: 14px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 16px; }
  #save:disabled { opacity: .5; }
  #sum { text-align: center; font-size: 13px; color: var(--hint); min-height: 17px; }
  #ver { position: fixed; left: 6px; bottom: 2px; font-size: 9px; color: var(--hint); }
</style>
</head>
<body>
<div class="card" id="textBox"><textarea id="text" dir="auto" placeholder="📝 یادداشت… مثلاً: زنگ به علی درباره MR"></textarea></div>
<div class="row" id="quick"></div>
<div class="card" id="cal">
  <div id="calHead"><button id="prev">›</button><span id="month"></span><button id="next">‹</button></div>
  <div id="grid"></div>
</div>
<div class="card" id="time">
  <button data-s="-60">−</button><span id="hh"></span><button data-s="60">+</button>
  <b>:</b>
  <button data-s="-15">−</button><span id="mm"></span><button data-s="15">+</button>
</div>
<div class="row" id="repeat"></div>
<div id="sum"></div>
<button id="save">ذخیره</button>
<div id="ver">v3</div>
<script>
// Answers the bot through Telegram: {"text" or "id", "due": "YYYY-MM-DD HH:MM", "repeat": ""|day|work|week|month}
// No telegram-web-app.js (it loads from telegram.org, blocked on some networks): we post the event ourselves.
const hash = new URLSearchParams(location.hash.slice(1));
const inTg = Boolean(window.TelegramWebviewProxy || hash.get("tgWebAppPlatform"));
function postEvent(type, data) {
  if (window.TelegramWebviewProxy) TelegramWebviewProxy.postEvent(type, JSON.stringify(data || {}));
  else window.parent.postMessage(JSON.stringify({eventType: type, eventData: data || {}}), "*");
}
try {
  const t = JSON.parse(hash.get("tgWebAppThemeParams") || "{}"), css = document.documentElement.style;
  if (t.bg_color) css.setProperty("--bg", t.bg_color);
  if (t.text_color) css.setProperty("--text", t.text_color);
  if (t.hint_color) css.setProperty("--hint", t.hint_color);
  if (t.secondary_bg_color) css.setProperty("--card", t.secondary_bg_color);
  if (t.button_color) css.setProperty("--accent", t.button_color);
  if (t.button_text_color) css.setProperty("--accent-text", t.button_text_color);
} catch (e) {}

const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id");
const MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const WEEK = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
const REPEATS = [["", "یک بار"], ["day", "روزانه"], ["work", "روز کاری"], ["week", "هفتگی"], ["month", "ماهانه"]];
const QUICK = [["30", "۳۰ دقیقه"], ["60", "۱ ساعت"], ["180", "۳ ساعت"], ["tom", "فردا ۹"]];
const fa = s => String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const pad = n => String(n).padStart(2, "0");
const DAY = 864e5;

function jalali(d) {  // same as jalali() in bin/arcane-bot
  const gy = d.getFullYear(), gm = d.getMonth() + 1, gd = d.getDate(), gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
    + Math.floor((gy2 + 399) / 400) + gd + [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334][gm - 1];
  let jy = -1595 + 33 * Math.floor(days / 12053);
  days %= 12053; jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  return days < 186 ? [jy, 1 + Math.floor(days / 31), 1 + days % 31]
                    : [jy, 7 + Math.floor((days - 186) / 30), 1 + (days - 186) % 30];
}

function firstOfMonth(jy, jm) {  // Gregorian date of Jalali jy/jm/1
  let d = new Date(jy + 621, 2, 21 + (jm <= 7 ? (jm - 1) * 31 : 186 + (jm - 7) * 30));
  for (let i = 0; i < 5 && jalali(d)[2] !== 1; i++) d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + (jalali(d)[2] > 15 ? 1 : -1));
  return d;
}

const today = new Date(); today.setHours(0, 0, 0, 0);
let sel = new Date(Date.now() + 3600e3), view, repeat = "", quick = "";
sel.setMinutes(0, 0, 0);
view = jalali(sel).slice(0, 2);

function renderCal() {
  const [jy, jm] = view, first = firstOfMonth(jy, jm), selDay = new Date(sel).setHours(0, 0, 0, 0);
  $("month").textContent = MONTHS[jm - 1] + " " + fa(jy);
  const grid = $("grid"); grid.innerHTML = "";
  WEEK.forEach(w => { const c = document.createElement("div"); c.textContent = w; grid.appendChild(c); });
  for (let i = 0; i < (first.getDay() + 1) % 7; i++) grid.appendChild(document.createElement("div"));
  for (let d = new Date(first); jalali(d)[1] === jm; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
    const b = document.createElement("button"), day = new Date(d);
    b.textContent = fa(jalali(d)[2]);
    b.disabled = d < today;
    b.classList.toggle("today", +d === +today);
    b.classList.toggle("fri", d.getDay() === 5);
    b.classList.toggle("on", +d === selDay);
    b.onclick = () => { sel.setFullYear(day.getFullYear(), day.getMonth(), day.getDate()); quick = ""; render(); };
    grid.appendChild(b);
  }
  $("prev").disabled = jy * 12 + jm <= jalali(today)[0] * 12 + jalali(today)[1];
}

function chips(box, items, isOn, onTap) {
  box.innerHTML = "";
  items.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.classList.toggle("on", isOn(key));
    b.onclick = () => { onTap(key); render(); };
    box.appendChild(b);
  });
}

function dayName(d) {
  const n = Math.round((new Date(d).setHours(0, 0, 0, 0) - today) / DAY), [, jm, jd] = jalali(d);
  return n === 0 ? "امروز" : n === 1 ? "فردا" : fa(jd) + " " + MONTHS[jm - 1];
}

function render() {
  renderCal();
  chips($("quick"), QUICK, k => k === quick, k => {
    quick = k;
    if (k === "tom") { sel = new Date(today.getTime() + DAY); sel.setHours(9); }
    else { sel = new Date(Date.now() + Number(k) * 60e3); sel.setSeconds(0, 0); }
    view = jalali(sel).slice(0, 2);
  });
  chips($("repeat"), REPEATS, r => r === repeat, r => repeat = r);
  $("hh").textContent = fa(pad(sel.getHours()));
  $("mm").textContent = fa(pad(sel.getMinutes()));
  const future = sel > new Date();
  $("sum").textContent = future ? "⏰ " + dayName(sel) + " ساعت " + fa(pad(sel.getHours()) + ":" + pad(sel.getMinutes()))
    + (repeat ? " · 🔁 " + REPEATS.find(r => r[0] === repeat)[1] : "") : "⚠️ این زمان گذشته است";
  $("save").disabled = !future || !(id || $("text").value.trim());
}

function send() {
  const s = sel, data = {due: `${s.getFullYear()}-${pad(s.getMonth() + 1)}-${pad(s.getDate())} ${pad(s.getHours())}:${pad(s.getMinutes())}`, repeat};
  if (id) data.id = Number(id); else data.text = $("text").value.trim();
  if (!inTg) return alert("Not inside Telegram:\n" + JSON.stringify(data));
  $("save").textContent = "در حال ارسال…";
  postEvent("web_app_data_send", {data: JSON.stringify(data)});  // Telegram closes the page on success
  setTimeout(() => { $("save").textContent = "ذخیره"; $("sum").textContent =
    "⚠️ تلگرام داده را نگرفت. صفحه را ببند و از دکمه ⏰ Reminder پایین چت دوباره باز کن."; }, 2500);
}

// time: − / + by one hour or 15 minutes (minutes snap to :00 :15 :30 :45)
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  const step = Number(b.dataset.s), m = sel.getMinutes();
  sel = new Date(sel.getTime() + (step === 15 || step === -15 ? (step > 0 ? 15 - m % 15 : -(m % 15 || 15)) : step) * 60e3);
  quick = ""; view = jalali(sel).slice(0, 2); render();
});
$("prev").onclick = () => { view = view[1] === 1 ? [view[0] - 1, 12] : [view[0], view[1] - 1]; renderCal(); };
$("next").onclick = () => { view = view[1] === 12 ? [view[0] + 1, 1] : [view[0], view[1] + 1]; renderCal(); };
$("text").oninput = render;
$("save").onclick = send;
if (id) $("textBox").style.display = "none";
if (inTg) { postEvent("web_app_ready"); postEvent("web_app_expand"); }
render();
</script>
</body>
</html>
